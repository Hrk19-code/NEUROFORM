[package]
name = "neuroform-cli"
version.workspace = true
edition.workspace = true
description = "Neuroform command-line interface (create/verify/tick/inspect)"

[[bin]]
name = "neuroform"
path = "src/main.rs"

[dependencies]
brain-core = { path = "../../packages/brain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
